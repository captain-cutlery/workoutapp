<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Calisthenics Log</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="topTitle">Today</h1>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
    </div>
    <div id="weekStrip" class="week-strip" aria-label="This week"></div>
  </header>

  <main id="view" class="view"></main>

  <!-- Persistent rest timer banner (survives tab switches) -->
  <div id="restBar" class="rest-bar" hidden>
    <button class="rest-adj" data-rest="-15">−15</button>
    <div class="rest-mid">
      <div id="restTime" class="rest-time">1:30</div>
      <div class="rest-label">Rest</div>
    </div>
    <button class="rest-adj" data-rest="15">+15</button>
    <button id="restToggle" class="rest-adj" aria-label="Pause">⏸</button>
    <button id="restSkip" class="rest-skip" aria-label="Skip">✕</button>
  </div>

  <nav class="tabbar" role="tablist">
    <button class="tab is-active" data-tab="today" role="tab">
      <span class="tab-ico">☀</span><span>Today</span>
    </button>
    <button class="tab" data-tab="log" role="tab">
      <span class="tab-ico">＋</span><span>Log</span>
    </button>
    <button class="tab" data-tab="stats" role="tab">
      <span class="tab-ico">📈</span><span>Stats</span>
    </button>
    <button class="tab" data-tab="history" role="tab">
      <span class="tab-ico">≡</span><span>History</span>
    </button>
  </nav>

  <!-- Logging / edit sheet -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <h2 id="sheetTitle">Log movement</h2>
      <p id="sheetCues" class="cues"></p>
      <div id="lastTime" class="last-time" hidden></div>

      <label class="field-label">Variation</label>
      <div id="variationRow" class="chip-row"></div>

      <div id="repsBlock">
        <label class="field-label" id="valueLabel">Reps</label>
        <div class="stepper">
          <button class="step-btn" data-step="-1" aria-label="Decrease">−</button>
          <input id="valueInput" class="value-input" type="number" inputmode="numeric" value="8" min="0" />
          <button class="step-btn" data-step="1" aria-label="Increase">＋</button>
        </div>
      </div>

      <label class="field-label">Effort — stop a couple reps shy of failure</label>
      <div id="rirRow" class="chip-row"></div>

      <label class="field-label">Added weight (<span id="weightUnitLabel">kg</span>) — optional</label>
      <div class="stepper">
        <button class="step-btn" data-wstep="-2.5" aria-label="Less weight">−</button>
        <input id="weightInput" class="value-input" type="number" inputmode="decimal" value="0" min="0" step="0.5" />
        <button class="step-btn" data-wstep="2.5" aria-label="More weight">＋</button>
      </div>

      <label class="field-label">Note — optional</label>
      <input id="noteInput" class="note-input" type="text" placeholder="How it felt, tweaks, niggles…" />

      <div class="sheet-actions">
        <button id="saveSet" class="btn-primary">Save set</button>
        <button id="deleteSet" class="btn-outline danger" hidden>Delete this set</button>
        <button class="btn-ghost" data-close>Cancel</button>
      </div>
      <div id="sheetSaved" class="saved-hint" hidden></div>
    </div>
  </div>

  <!-- Custom session editor sheet -->
  <div id="sessionSheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close-session></div>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <h2>Edit Today's session</h2>
      <p class="cues">Pick the movements that appear under Today and set your own targets.</p>
      <div id="sessionEditor"></div>
      <div class="sheet-actions">
        <button id="saveSession" class="btn-primary">Save session</button>
        <button id="resetSession" class="btn-ghost">Reset to default</button>
      </div>
    </div>
  </div>

  <!-- Settings sheet -->
  <div id="settingsSheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close-settings></div>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <h2>Settings</h2>

      <label class="field-label">Rest timer</label>
      <label class="toggle-row">
        <span>Auto-start rest after each set</span>
        <input type="checkbox" id="setAutoRest" />
      </label>

      <label class="field-label">Default rest length</label>
      <div id="restLenRow" class="chip-row"></div>
      <div class="stepper" style="margin-top:10px">
        <button class="step-btn" data-restadj="-15" aria-label="Less">−</button>
        <input id="restLenInput" class="value-input" type="number" inputmode="numeric" value="90" min="5" />
        <button class="step-btn" data-restadj="15" aria-label="More">＋</button>
      </div>

      <label class="field-label">Weight unit</label>
      <div id="unitRow" class="chip-row"></div>

      <label class="field-label">Workout reminder</label>
      <p class="cues">Pick days &amp; a time, then add a recurring reminder to your phone's calendar — works offline, no permissions.</p>
      <div id="remDays" class="chip-row"></div>
      <div class="rem-time-row">
        <span>Time</span>
        <input id="remTime" type="time" class="time-input" value="18:00" />
      </div>
      <button id="addReminder" class="btn-outline" style="margin-top:12px">📅 Add reminder to calendar</button>

      <div class="sheet-actions">
        <button id="saveSettings" class="btn-primary">Save</button>
        <button class="btn-ghost" data-close-settings>Close</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input for restoring a backup -->
  <input id="importFile" type="file" accept="application/json,.json" hidden />

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          // Pull updates on each launch; reload once a new worker takes control.
          reg.update();
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
